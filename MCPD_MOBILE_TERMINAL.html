    <script>
        

window.onerror = function(msg, url, lineNo, columnNo, error) {
    var errorNode = document.createElement('div');
    errorNode.style.position = 'fixed';
    errorNode.style.top = '0';
    errorNode.style.left = '0';
    errorNode.style.background = 'red';
    errorNode.style.color = 'white';
    errorNode.style.padding = '20px';
    errorNode.style.zIndex = '999999';
    errorNode.innerHTML = 'ERROR: ' + msg + ' on line ' + lineNo + ' in ' + url;
    document.body.appendChild(errorNode);
};
</script>

<style>
@keyframes scanline {
    0% { top: -10%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 110%; opacity: 0; }
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<script>
function attemptTerminalLogin() {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    const errorEl = document.getElementById('login-error');

    if (user === '' && pass === '') {
        errorEl.textContent = "[!] ERROR: You forgot to insert your username and password.";
        return;
    }
    if (user === '') {
        errorEl.textContent = "[!] ERROR: You forgot to insert your username.";
        return;
    }
    if (pass === '') {
        errorEl.textContent = "[!] ERROR: You forgot to insert your password.";
        return;
    }

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'flex';
    
    let loadingText = document.getElementById('loading-text');
    loadingText.textContent = "AUTHENTICATING CREDENTIALS...";
    
    setTimeout(() => loadingText.textContent = "BYPASSING FIREWALLS...", 800);
    setTimeout(() => loadingText.textContent = "ENCRYPTING DATASTREAM...", 1600);
    setTimeout(() => loadingText.textContent = "CONNECTION SECURED. INITIALIZING...", 2400);

    setTimeout(() => {
        document.getElementById('mcpd-login-overlay').style.display = 'none';
        let chatInput = document.getElementById('chat-input');
        if (chatInput) chatInput.focus();
    }, 3200);
}

document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && document.getElementById('mcpd-login-overlay').style.display !== 'none' && document.getElementById('login-screen').style.display !== 'none') {
        attemptTerminalLogin();
    }
});
</script>
